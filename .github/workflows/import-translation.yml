name: Importar tradução PT-BR

on:
  push:
    branches:
      - translation/initial-ptbr
    paths:
      - plutocracyptbr.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: translation/initial-ptbr

      - name: Validar pacote
        shell: bash
        run: |
          test -f plutocracyptbr.zip || { echo 'plutocracyptbr.zip não encontrado'; exit 1; }

      - name: Extrair e normalizar caminhos
        shell: python
        run: |
          import pathlib
          import zipfile

          archive = pathlib.Path('plutocracyptbr.zip')
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace('\\', '/').lstrip('/')
                  if not name or name.endswith('/'):
                      continue
                  if not name.startswith('pt/'):
                      raise SystemExit(f'Caminho inesperado no ZIP: {name}')
                  dest = pathlib.Path(name)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(info))

          required = pathlib.Path('pt/lang.xml')
          if not required.exists():
              raise SystemExit('pt/lang.xml não foi extraído; pacote inválido')

      - name: Limpar arquivos temporários
        shell: bash
        run: |
          rm -f plutocracyptbr.zip
          rm -rf .bootstrap .import .bundle .payload
          rm -f .github/workflows/import-translation.yml

      - name: Commitar tradução
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: adiciona tradução completa de Plutocracy para pt-BR'
          git push origin HEAD:translation/initial-ptbr
